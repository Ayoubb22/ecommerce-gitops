replicaCount: 1

image:
  repository: order-service
  tag: "local"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  liveness:
    path: /actuator/health/liveness
    initialDelaySeconds: 60
  readiness:
    path: /actuator/health/readiness
    initialDelaySeconds: 45

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

env:
  - name: DB_HOST
    value: order-service-postgres
  - name: DB_PORT
    value: "5432"
  - name: DB_NAME
    value: order
  - name: DB_USER
    value: order
  - name: DB_PASSWORD
    value: order
  - name: RABBITMQ_HOST
    value: rabbitmq
  - name: RABBITMQ_PORT
    value: "5672"
  - name: RABBITMQ_USER
    value: guest
  - name: RABBITMQ_PASSWORD
    value: guest
