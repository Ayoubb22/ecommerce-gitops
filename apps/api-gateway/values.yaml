replicaCount: 2

image:
  repository: <dockerhub-username>/api-gateway   # ou ghcr.io/<owner>/api-gateway
  tag: "latest"      # mis à jour automatiquement par la CI (voir ecommerce-app)
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi

probes:
  liveness:
    path: /actuator/health/liveness
    initialDelaySeconds: 10
  readiness:
    path: /actuator/health/readiness
    initialDelaySeconds: 5

autoscaling:
  enabled: false   # activer pour au moins 2 services en phase 8 (cf. cahier des charges §4.5/§5)
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

env: []
  # - name: SPRING_DATASOURCE_URL
  #   value: jdbc:postgresql://postgres-catalog:5432/catalog
