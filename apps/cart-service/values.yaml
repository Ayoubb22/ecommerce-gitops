replicaCount: 1

image:
  repository: cart-service
  tag: "local"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

probes:
  liveness:
    path: /actuator/health
    initialDelaySeconds: 5
  readiness:
    path: /actuator/health
    initialDelaySeconds: 5

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

env:
  - name: REDIS_HOST
    value: cart-service-redis
  - name: REDIS_PORT
    value: "6379"
