replicaCount: 1

image:
  repository: catalog-service
  tag: "local"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  liveness:
    path: /actuator/health/liveness
    initialDelaySeconds: 15
  readiness:
    path: /actuator/health/readiness
    initialDelaySeconds: 10

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

env:
  - name: DB_HOST
    value: catalog-service-postgres
  - name: DB_PORT
    value: "5432"
  - name: DB_NAME
    value: catalog
  - name: DB_USER
    value: catalog
  - name: DB_PASSWORD
    value: catalog
