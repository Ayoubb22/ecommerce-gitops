replicaCount: 1

image:
  repository: notification-service
  tag: "local"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

probes:
  liveness:
    path: /actuator/health
    initialDelaySeconds: 5
  readiness:
    path: /actuator/health
    initialDelaySeconds: 5

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

env:
  - name: RABBITMQ_HOST
    value: rabbitmq
  - name: RABBITMQ_PORT
    value: "5672"
  - name: RABBITMQ_USER
    value: guest
  - name: RABBITMQ_PASSWORD
    value: guest
